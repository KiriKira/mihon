name: Fork build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref or commit to build (defaults to the triggering ref)
        required: false
        type: string
      release_mode:
        description: Build only, publish a same-version fork release, or publish an upstream-version release
        required: true
        default: build
        type: choice
        options:
          - build
          - auto
          - local
          - prerelease

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORK_REPOSITORY: KiriKira/mihon

jobs:
  build:
    name: Build and verify signed APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      base_version: ${{ steps.metadata.outputs.base_version }}
      fork_version_name: ${{ steps.metadata.outputs.fork_version_name }}
      fork_version_code: ${{ steps.metadata.outputs.fork_version_code }}
      tag: ${{ steps.metadata.outputs.tag }}
      source_commit: ${{ steps.metadata.outputs.source_commit }}
      publish: ${{ steps.mode.outputs.publish }}
      prerelease: ${{ steps.mode.outputs.prerelease }}
      release_mode: ${{ steps.mode.outputs.release_mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Read fork release metadata
        id: metadata
        run: .github/scripts/read-release-metadata.sh

      - name: Decide whether to publish
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.release_mode || 'build' }}
          GH_TOKEN: ${{ github.token }}
          BASE_VERSION: ${{ steps.metadata.outputs.base_version }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail

          publish=false
          prerelease=false
          mode="$REQUESTED_MODE"

          case "$mode" in
            build)
              ;;
            local)
              publish=true
              ;;
            prerelease)
              publish=true
              prerelease=true
              ;;
            auto)
              prefix="v${BASE_VERSION}-kiri."
              stable_tag="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
                awk -v prefix="$prefix" 'index($0, prefix) == 1 { print; exit }')"
              if [[ -z "$stable_tag" ]]; then
                publish=true
              else
                echo "A stable fork release already exists for upstream ${BASE_VERSION}: ${stable_tag}"
              fi
              ;;
            *)
              echo "Unsupported release mode: $mode" >&2
              exit 1
              ;;
          esac

          {
            echo "release_mode=$mode"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Build release and FOSS variants
        env:
          MIHON_GITHUB_RELEASE: true
          MIHON_RELEASE_REPO: ${{ env.FORK_REPOSITORY }}
          MIHON_RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          MIHON_VERSION_NAME: ${{ steps.metadata.outputs.fork_version_name }}
          MIHON_VERSION_CODE: ${{ steps.metadata.outputs.fork_version_code }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          keystore="$RUNNER_TEMP/mihon-release.keystore.p12"
          if [[ -n "$SIGNING_KEY" || -n "$SIGNING_ALIAS" || -n "$SIGNING_STORE_PASSWORD" || -n "$SIGNING_KEY_PASSWORD" ]]; then
            if [[ -z "$SIGNING_KEY" || -z "$SIGNING_ALIAS" || -z "$SIGNING_STORE_PASSWORD" || -z "$SIGNING_KEY_PASSWORD" ]]; then
              echo "The SIGNING_KEY/ALIAS/KEY_STORE_PASSWORD/KEY_PASSWORD set is incomplete." >&2
              exit 1
            fi
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$keystore"
            key_alias="$SIGNING_ALIAS"
            store_password="$SIGNING_STORE_PASSWORD"
            key_password="$SIGNING_KEY_PASSWORD"
            key_source="repository secrets"
          elif [[ -n "$ANDROID_KEYSTORE_BASE64" || -n "$ANDROID_KEY_ALIAS" || -n "$ANDROID_KEYSTORE_PASSWORD" || -n "$ANDROID_KEY_PASSWORD" ]]; then
            if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_PASSWORD" ]]; then
              echo "The ANDROID_KEYSTORE_* secret set is incomplete." >&2
              exit 1
            fi
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            key_alias="$ANDROID_KEY_ALIAS"
            store_password="$ANDROID_KEYSTORE_PASSWORD"
            key_password="$ANDROID_KEY_PASSWORD"
            key_source="legacy repository secrets"
          else
            cp .github/keystore/ci.p12 "$keystore"
            key_alias=mihon-ci
            store_password=android
            key_password=android
            key_source="committed CI keystore"
          fi

          expected_cert="$(tr -d '[:space:]\r\n' < .github/signing-cert.sha256)"
          expected_cert="$(printf '%s' "$expected_cert" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          actual_cert="$(keytool -list -v -storetype PKCS12 -keystore "$keystore" -storepass "$store_password" -alias "$key_alias" |
            sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':[:space:]\r\n' | tr '[:lower:]' '[:upper:]')"
          if [[ "$actual_cert" != "$expected_cert" ]]; then
            echo "The configured signing key does not match .github/signing-cert.sha256." >&2
            echo "Expected: $expected_cert" >&2
            echo "Actual:   $actual_cert" >&2
            exit 1
          fi

          export storeFileBase64="$(base64 -w 0 "$keystore")"
          export storePassword="$store_password"
          export keyAlias="$key_alias"
          export keyPassword="$key_password"
          echo "Using $key_source with the expected certificate fingerprint."

          ./gradlew assembleRelease assembleFoss -Pinclude-telemetry -Penable-updater

          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/mihon-${{ steps.metadata.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/mihon-arm64-v8a-${{ steps.metadata.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "dist/mihon-armeabi-v7a-${{ steps.metadata.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-x86-release.apk "dist/mihon-x86-${{ steps.metadata.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-x86_64-release.apk "dist/mihon-x86_64-${{ steps.metadata.outputs.tag }}.apk"
          cp app/build/outputs/apk/foss/app-universal-foss.apk "dist/mihon-${{ steps.metadata.outputs.tag }}-foss.apk"

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "Could not find Android build-tools apksigner." >&2
            exit 1
          fi
          KEYSTORE_FILE="$keystore" \
          KEYSTORE_PASSWORD="$store_password" \
          KEY_ALIAS="$key_alias" \
          EXPECTED_CERT_SHA256="$(cat .github/signing-cert.sha256)" \
          APKSIGNER="$apksigner" \
          .github/scripts/verify-apk-signature.sh

          sha256sum dist/*.apk > dist/SHA256SUMS
      - name: Upload APKs and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-apks-${{ steps.metadata.outputs.tag }}
          path: dist
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download APKs and checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fork-apks-${{ needs.build.outputs.tag }}
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          BASE_VERSION: ${{ needs.build.outputs.base_version }}
          FORK_VERSION_NAME: ${{ needs.build.outputs.fork_version_name }}
          FORK_VERSION_CODE: ${{ needs.build.outputs.fork_version_code }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          RELEASE_MODE: ${{ needs.build.outputs.release_mode }}
        run: |
          set -euo pipefail

          notes="$(mktemp)"
          {
            echo "Automated KiriKira fork build based on upstream Mihon ${BASE_VERSION}."
            echo
            echo "- Fork version: \`${FORK_VERSION_NAME}\`"
            echo "- Android versionCode: \`${FORK_VERSION_CODE}\`"
            echo "- Source commit: [${SOURCE_COMMIT}](https://github.com/${GITHUB_REPOSITORY}/commit/${SOURCE_COMMIT})"
            echo "- Release mode: \`${RELEASE_MODE}\`"
            echo "- Signing certificate SHA-256: \`$(cat dist/SIGNING_CERT_SHA256)\`"
            echo
            echo "See \`SHA256SUMS\` for artifact checksums. Releases signed with the same certificate can be installed over one another."
          } > "$notes"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*.apk dist/SHA256SUMS dist/SIGNING_CERT_SHA256
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id')"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f name="Mihon ${FORK_VERSION_NAME}" \
              -f body="$(cat "$notes")" \
              -F prerelease="$PRERELEASE" >/dev/null
          else
            args=(release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --title "Mihon ${FORK_VERSION_NAME}" --notes-file "$notes")
            if [[ "$PRERELEASE" == true ]]; then
              args+=(--prerelease)
            fi
            args+=(dist/*.apk dist/SHA256SUMS dist/SIGNING_CERT_SHA256)
            gh "${args[@]}"
          fi
