name: Publish fork CI build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-ci-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      version_name: ${{ steps.meta.outputs.version_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: meta
        run: |
          set -euo pipefail
          base_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"
          base_version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          [[ "$base_code" =~ ^[0-9]+$ && "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || exit 1
          commit_count="$(git rev-list --count HEAD)"
          version_code="$((base_code * 100000 + commit_count))"
          version_name="${base_version}-kiri.${commit_count}"
          tag="v${version_name}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=Mihon fork CI $version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: metadata
    uses: ./.github/workflows/kiri-release.yml
    with:
      release_tag: ${{ needs.metadata.outputs.tag }}
      target_sha: ${{ github.sha }}
      release_name: ${{ needs.metadata.outputs.name }}
      prerelease: true
      version_code: ${{ needs.metadata.outputs.version_code }}
      version_name: ${{ needs.metadata.outputs.version_name }}
    secrets: inherit
