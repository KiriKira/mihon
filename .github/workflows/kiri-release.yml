name: Build and publish fork release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Git tag to create or update
        required: true
        type: string
      target_sha:
        description: Commit to build and attach to the release
        required: true
        type: string
      release_name:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
      version_code:
        description: Android versionCode override
        required: false
        type: string
      version_name:
        description: Android versionName override
        required: false
        type: string
      upstream_release_url:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag
        required: true
        type: string
      target_sha:
        description: Commit to build
        required: false
        type: string
      release_name:
        description: GitHub release title
        required: false
        default: Mihon fork manual build
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: false
        default: true
        type: boolean
      version_code:
        description: Android versionCode override
        required: false
        type: string
      version_name:
        description: Android versionName override
        required: false
        type: string
      upstream_release_url:
        description: Upstream release URL for the notes
        required: false
        type: string

concurrency:
  group: kiri-release-${{ inputs.release_tag || github.event.inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.inputs.release_tag }}
      TARGET_SHA: ${{ inputs.target_sha || github.event.inputs.target_sha || github.sha }}
      RELEASE_NAME: ${{ inputs.release_name || github.event.inputs.release_name || format('Mihon fork build {0}', github.event.inputs.release_tag) }}
      PRERELEASE: ${{ inputs.prerelease || github.event.inputs.prerelease || false }}
      VERSION_CODE: ${{ inputs.version_code || github.event.inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name || github.event.inputs.version_name }}
      UPSTREAM_RELEASE_URL: ${{ inputs.upstream_release_url || github.event.inputs.upstream_release_url }}
    steps:
      - name: Check out requested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Build release and FOSS APKs
        env:
          MIHON_VERSION_CODE: ${{ env.VERSION_CODE }}
          MIHON_VERSION_NAME: ${{ env.VERSION_NAME }}
          MIHON_RELEASE_REPO: ${{ github.repository }}
          MIHON_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease -Pinclude-telemetry -Penable-updater
          ./gradlew assembleFoss -Penable-updater

      - name: Prepare persistent signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          preferred_count=0
          legacy_count=0
          for value in "$SIGNING_KEY" "$ALIAS" "$KEY_STORE_PASSWORD" "$KEY_PASSWORD"; do
            [[ -n "$value" ]] && ((preferred_count += 1))
          done
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEY_ALIAS" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD"; do
            [[ -n "$value" ]] && ((legacy_count += 1))
          done

          if (( preferred_count > 0 && preferred_count < 4 )); then
            echo "SIGNING_KEY, ALIAS, KEY_STORE_PASSWORD, and KEY_PASSWORD must be configured together." >&2
            exit 1
          elif (( preferred_count == 4 )); then
            printf '%s' "$SIGNING_KEY" | base64 --decode > signing.p12
            key_alias="$ALIAS"
            keystore_password="$KEY_STORE_PASSWORD"
            key_password="$KEY_PASSWORD"
          elif (( legacy_count > 0 && legacy_count < 4 )); then
            echo "The legacy ANDROID_KEYSTORE_* secrets must be configured together." >&2
            exit 1
          elif (( legacy_count == 4 )); then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing.p12
            key_alias="$ANDROID_KEY_ALIAS"
            keystore_password="$ANDROID_KEYSTORE_PASSWORD"
            key_password="$ANDROID_KEY_PASSWORD"
          else
            # This committed key is intentionally only a public CI distribution key.
            # Production forks should set the preferred secrets above.
            cp .github/keystore/ci.p12 signing.p12
            key_alias=mihon-ci
            keystore_password=android
            key_password=android
          fi

          actual_cert="$(keytool -list -v -keystore signing.p12 -storetype PKCS12 -storepass "$keystore_password" -alias "$key_alias" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected_cert="$(tr -d ':[:space:]' < .github/signing-cert.sha256 | tr '[:lower:]' '[:upper:]')"
          [[ "$actual_cert" == "$expected_cert" ]] || {
            echo "Signing certificate does not match .github/signing-cert.sha256." >&2
            exit 1
          }
          {
            echo "KEY_ALIAS=$key_alias"
            echo "KEYSTORE_PASSWORD=$keystore_password"
            echo "KEY_PASSWORD=$key_password"
            echo "SIGNING_CERT_SHA256=$expected_cert"
          } >> "$GITHUB_ENV"

      - name: Sign, verify, and checksum APKs
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p release-assets
          shopt -s nullglob

          sign_apk() {
            local apk="$1"
            local output="$2"
            local aligned="${output}.aligned"
            "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$apk" "$aligned"
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks signing.p12 \
              --ks-type PKCS12 \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$output" "$aligned"
            rm "$aligned"
            cert="$("$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$output" 2>&1 | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
            [[ "$cert" == "$SIGNING_CERT_SHA256" ]] || {
              echo "Signed APK certificate mismatch: $output" >&2
              exit 1
            }
          }

          release_apks=(app/build/outputs/apk/release/*-unsigned.apk)
          ((${#release_apks[@]})) || { echo "No release APKs were produced" >&2; exit 1; }
          for apk in "${release_apks[@]}"; do
            stem="$(basename "$apk" -unsigned.apk)"
            case "$stem" in
              app-universal-release) output="release-assets/mihon-${RELEASE_TAG}.apk" ;;
              app-*-release)
                abi="${stem#app-}"
                abi="${abi%-release}"
                output="release-assets/mihon-${RELEASE_TAG}-${abi}.apk"
                ;;
              *) echo "Unexpected release APK name: $stem" >&2; exit 1 ;;
            esac
            sign_apk "$apk" "$output"
          done

          foss_apk="app/build/outputs/apk/foss/app-universal-foss-unsigned.apk"
          [[ -f "$foss_apk" ]] || { echo "No universal FOSS APK was produced" >&2; exit 1; }
          sign_apk "$foss_apk" "release-assets/mihon-${RELEASE_TAG}-foss.apk"

          (cd release-assets && sha256sum *.apk > SHA256SUMS)
          cp release-assets/SHA256SUMS release-assets/checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=release-notes.md
          {
            echo "Automated build from commit \`$TARGET_SHA\`."
            if [[ -n "$UPSTREAM_RELEASE_URL" ]]; then
              echo
              echo "Upstream release: $UPSTREAM_RELEASE_URL"
            fi
            echo
            echo "Android versionName: \`$VERSION_NAME\`"
            echo "Android versionCode: \`$VERSION_CODE\`"
            echo
            echo "Signing certificate SHA-256: \`$SIGNING_CERT_SHA256\`"
            echo
            echo "The persistent fork signing key lets a newer build install over an older fork build. Changing that key requires users to uninstall first."
          } > "$notes"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            edit_args=(--title "$RELEASE_NAME" --notes-file "$notes")
            if [[ "$PRERELEASE" == "true" ]]; then
              edit_args+=(--prerelease)
            else
              edit_args+=(--latest)
            fi
            gh release edit "$RELEASE_TAG" "${edit_args[@]}"
          else
            create_args=(--target "$TARGET_SHA" --title "$RELEASE_NAME" --notes-file "$notes")
            [[ "$PRERELEASE" == "true" ]] && create_args+=(--prerelease)
            gh release create "$RELEASE_TAG" release-assets/* "${create_args[@]}"
          fi
