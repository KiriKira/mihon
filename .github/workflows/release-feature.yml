name: Release feature APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature-dual-page-skip-spread-*

concurrency:
  group: release-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign-release:
    name: Build, sign & release
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .github/.java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mihon-release.keystore.p12
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using project keystore from secrets."
          else
            keytool -genkeypair \
              -alias mihon-ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype PKCS12 \
              -keystore mihon-release.keystore.p12 \
              -storepass android \
              -keypass android \
              -dname "CN=Mihon CI, OU=Mobile, O=Mihon, L=Remote, ST=Remote, C=US"
            echo "KEY_ALIAS=mihon-ci" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "::warning::No signing secrets configured; using throwaway CI keystore. APKs cannot upgrade installs signed with a different certificate."
          fi

      - name: Sign release APKs
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          mkdir -p signed-apks
          shopt -s nullglob
          for apk in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk" .apk)
            base=${base/-unsigned/}
            aligned="signed-apks/${base}-aligned.apk"
            signed="signed-apks/${base}-signed.apk"
            "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$apk" "$aligned"
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks mihon-release.keystore.p12 \
              --ks-type PKCS12 \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out "$signed" \
              "$aligned"
            "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$signed"
            rm -f "$aligned"
          done

      - name: Upload signed APKs
        uses: actions/upload-artifact@v6
        with:
          name: mihon-signed-apks-${{ github.sha }}
          path: signed-apks/*-signed.apk
          if-no-files-found: error

      - name: Compute release metadata
        id: release_meta
        run: |
          DATE_TAG="$(date -u +'%Y.%m.%d')"
          RUN_SUFFIX="${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="ci-${DATE_TAG}-${RUN_SUFFIX}-${SHORT_SHA}"
          NAME="Mihon smart-split CI ${DATE_TAG} (#${RUN_SUFFIX})"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.release_meta.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          {
            echo "Automated signed pre-release built from \`${BRANCH_NAME}\` (${COMMIT_SHA})."
            echo
            echo "**Feature:** 智能识别 \"拆分双页\" 时的真正大跨页，自动跳过拆分。"
            echo
            echo "- \`*-signed.apk\`: 使用项目 keystore（若已配置 \`ANDROID_KEYSTORE_BASE64\` secret）；否则使用临时 CI keystore（无法覆盖安装其他证书签名的旧版本）。"
          } > "$NOTES_FILE"
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_NAME" \
            --notes-file "$NOTES_FILE" \
            --target "$COMMIT_SHA" \
            --prerelease \
            signed-apks/*-signed.apk
