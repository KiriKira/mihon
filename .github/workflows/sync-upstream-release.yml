name: Sync upstream release

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    outputs:
      synced: ${{ steps.sync.outputs.synced }}
      tag: ${{ steps.upstream.outputs.tag }}
      sha: ${{ steps.sync.outputs.sha }}
      release_url: ${{ steps.upstream.outputs.release_url }}
    steps:
      - name: Check out fork main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Read latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh api repos/mihonapp/mihon/releases/latest)"
          tag="$(jq -r .tag_name <<<"$release")"
          url="$(jq -r .html_url <<<"$release")"
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+){1,3}([._-][0-9A-Za-z.-]+)?$ ]] || { echo "Unexpected upstream tag: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_url=$url" >> "$GITHUB_OUTPUT"

      - name: Merge the upstream release tag
        id: sync
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/mihonapp/mihon.git
          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/upstream/$TAG"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Release $TAG was already synchronized."
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-ff "refs/tags/upstream/$TAG" -m "sync: upstream release $TAG"
          sha="$(git rev-parse HEAD)"
          git tag -a "$TAG" -m "Fork build of upstream $TAG" "$sha"
          git push origin HEAD:main "refs/tags/$TAG"
          echo "synced=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: sync
    if: needs.sync.outputs.synced == 'true'
    uses: ./.github/workflows/kiri-release.yml
    with:
      release_tag: ${{ needs.sync.outputs.tag }}
      target_sha: ${{ needs.sync.outputs.sha }}
      release_name: Mihon ${{ needs.sync.outputs.tag }}
      prerelease: false
      upstream_release_url: ${{ needs.sync.outputs.release_url }}
    secrets: inherit
